<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1a12" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>FitApp</title>
    <script>
      // Apply the last used mode before first paint so there is no color flash.
      try {
        var m = localStorage.getItem('fitapp.mode') === 'gym' ? 'gym' : 'nutrition';
        document.documentElement.dataset.mode = m;
        document.querySelector('meta[name="theme-color"]').content = m === 'gym' ? '#1a0b0b' : '#0b1a12';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
